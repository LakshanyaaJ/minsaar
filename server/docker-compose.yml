version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: minsaar-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: minsaar
    ports:
      - "${POSTGRES_HOST_PORT:-5434}:5432"
    volumes:
      - minsaar_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d minsaar"]
      interval: 3s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  minsaar_pgdata:
    name: minsaar_postgres_data